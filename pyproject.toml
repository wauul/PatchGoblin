[project]
name = "patchgoblin-worker"
version = "1.0.0"
description = "Bounded, evidence-driven Python CI agent"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<0.29",
    "PyYAML>=6.0,<7",
    "packaging>=24,<26",
    "psycopg[binary]>=3.2,<4",
    "pyjwt[crypto]>=2.10,<3",
    "ruamel-yaml>=0.18,<0.19",
    "tiktoken>=0.12,<1",
    "sentry-sdk>=2,<3",
]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.12,<0.13"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
