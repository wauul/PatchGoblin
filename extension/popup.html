<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>PatchGoblin</title>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <img src="goblin.svg" alt="" width="26" height="26" /><strong
          >PatchGoblin</strong
        >
      </div>
      <div class="preferences">
        <div class="language-picker">
          <button
            id="language"
            aria-label="Language"
            aria-haspopup="menu"
            aria-expanded="false"
            aria-controls="language-menu"
          >
            <span id="language-name">EN</span>
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path d="m6 9 6 6 6-6" />
            </svg>
          </button>
          <div id="language-menu" role="menu" aria-label="Language" hidden>
            <button
              role="menuitemradio"
              aria-checked="true"
              data-language="en"
              lang="en"
            >
              English<svg
                class="language-check"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                aria-hidden="true"
              >
                <path d="m5 12 4 4 10-10" />
              </svg>
            </button>
            <button
              role="menuitemradio"
              aria-checked="false"
              data-language="fr"
              lang="fr"
            >
              Français<svg
                class="language-check"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                aria-hidden="true"
              >
                <path d="m5 12 4 4 10-10" />
              </svg>
            </button>
          </div>
        </div>
        <button id="theme" class="icon-button" aria-label="Switch to dark mode">
          <svg
            class="sun"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2m0 16v2M2 12h2m16 0h2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
            /></svg
          ><svg
            class="moon"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path
              d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6.25 6.25 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"
            />
          </svg>
        </button>
      </div>
    </header>
    <main>
      <h1 id="repository">Reading the active tab</h1>
      <div id="status" role="status" aria-live="polite">
        Checking repository access…
      </div>
      <div id="jobs" aria-label="Recent repository jobs"></div>
      <div class="actions">
        <button id="repair" disabled data-i18n="Repair this failure">
          Repair this failure</button
        ><button id="builder" disabled data-i18n="Create CI">Create CI</button
        ><button id="open" class="primary" data-i18n="Open PatchGoblin">
          Open PatchGoblin</button
        ><button id="install" hidden data-i18n="Install on GitHub">
          Install on GitHub
        </button>
      </div>
      <p
        class="foot"
        data-i18n="Job actions open the web workbench. Review the selected repository and start the job there."
      >
        Job actions open the web workbench. Review the selected repository and
        start the job there.
      </p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
