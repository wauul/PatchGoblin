name: PatchGoblin evaluation
on:
  workflow_dispatch:
    inputs:
      case:
        description: Optional single fixture ID (blank runs all 12)
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: patchgoblin-evaluation
  cancel-in-progress: false
jobs:
  evaluate:
    if: github.actor == 'wauul'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
      - run: uv sync --frozen --group dev
      - uses: actions/cache@v4
        with:
          path: .local/model-runtime/qwen-coder-7b.gguf
          key: qwen-coder-7b-509287f7
      - name: Start pinned real inference server
        run: uv run --frozen python scripts/setup_runner_model.py
      - name: Real model + Docker evaluation and rule baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CASE_ID: ${{ inputs.case }}
        run: |
          if [ -n "$CASE_ID" ]; then
            uv run --frozen python -m worker.evaluate --case "$CASE_ID" --baseline --gate
          else
            uv run --frozen python -m worker.evaluate --baseline --gate
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-results
          path: docs/*.json
          retention-days: 30
