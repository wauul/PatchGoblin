name: PatchGoblin CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: guardrails-ci-only
          POSTGRES_DB: guardrails
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:guardrails-ci-only@127.0.0.1:5432/guardrails
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: node scripts/check-source-secrets.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
      - run: uv sync --frozen --group dev
      - run: npm test
      - run: npm run build:web
      - run: npm run build:extension
      - run: node scripts/check-sentry-artifacts.mjs
      - run: npm run build
      - run: uv run pytest -q
      - run: uv run ruff check worker tests
